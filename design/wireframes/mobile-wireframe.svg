<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="60%" stop-color="#130715"/>
      <stop offset="100%" stop-color="#381932"/>
    </linearGradient>
    <linearGradient id="mCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
  </defs>

  <!-- Mobile Screen -->
  <rect width="400" height="800" fill="url(#mBgGrad)"/>

  <!-- Mobile Header -->
  <rect x="20" y="20" width="360" height="46" rx="10" fill="#08080C" stroke="#ffffff" stroke-opacity="0.15"/>
  <rect x="35" y="31" width="24" height="24" rx="6" fill="#381932" stroke="#00F0FF"/>
  <text x="68" y="47" fill="#FFF3E6" font-family="monospace" font-size="12" font-weight="bold">SYNAPSE</text>
  <rect x="290" y="28" width="76" height="30" rx="6" fill="url(#mCyanPurple)"/>
  <text x="306" y="48" fill="#08080C" font-family="monospace" font-size="10" font-weight="bold">PASS</text>

  <!-- Mobile Hero -->
  <text x="200" y="110" text-anchor="middle" fill="#00F0FF" font-family="monospace" font-size="9" letter-spacing="2">// TECHFEST CONVERGENCE</text>
  <text x="200" y="150" text-anchor="middle" fill="#FFF3E6" font-family="monospace" font-size="24" font-weight="900">TRANSCEND THE</text>
  <text x="200" y="180" text-anchor="middle" fill="#9D4EDD" font-family="monospace" font-size="24" font-weight="900">QUANTUM GRID</text>

  <!-- Central Mobile 3D Core Icon -->
  <circle cx="200" cy="245" r="45" fill="#381932" stroke="#9D4EDD" stroke-width="2"/>
  <polygon points="200,205 240,225 240,265 200,285 160,265 160,225" fill="none" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Mobile Email Input -->
  <rect x="30" y="315" width="340" height="42" rx="10" fill="#08080C" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="45" y="341" fill="#FFF3E6" fill-opacity="0.5" font-family="monospace" font-size="10">university email...</text>
  <rect x="270" y="320" width="94" height="32" rx="6" fill="url(#mCyanPurple)"/>
  <text x="288" y="341" fill="#08080C" font-family="monospace" font-size="10" font-weight="bold">JOIN GRID</text>

  <!-- Mobile Stats Grid -->
  <rect x="30" y="375" width="162" height="60" rx="8" fill="#130715" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="45" y="400" fill="#00F0FF" font-family="monospace" font-size="9">PRIZE POOL</text>
  <text x="45" y="420" fill="#FFF3E6" font-family="monospace" font-size="14" font-weight="bold">₹25,00,000+</text>

  <rect x="208" y="375" width="162" height="60" rx="8" fill="#130715" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="220" y="400" fill="#9D4EDD" font-family="monospace" font-size="9">ATTENDEES</text>
  <text x="220" y="420" fill="#FFF3E6" font-family="monospace" font-size="14" font-weight="bold">50,000+</text>

  <!-- Mobile Flagship Arena Card -->
  <rect x="30" y="450" width="340" height="150" rx="14" fill="#0E0612" stroke="#00F0FF" stroke-opacity="0.4"/>
  <text x="45" y="478" fill="#00F0FF" font-family="monospace" font-size="9">SECTOR 01 // COMBAT</text>
  <text x="45" y="505" fill="#FFF3E6" font-family="sans-serif" font-size="16" font-weight="bold">ROBOWARS TITANIUM</text>
  <text x="45" y="530" fill="#FFF3E6" fill-opacity="0.7" font-family="sans-serif" font-size="11">60kg pneumatic crushers duel inside combat cage.</text>
  <rect x="45" y="555" width="310" height="32" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="140" y="575" fill="#FFF3E6" font-family="monospace" font-size="10" font-weight="bold">VIEW ARENA →</text>

  <!-- Mobile Teammate Matcher Card -->
  <rect x="30" y="615" width="340" height="140" rx="14" fill="#110714" stroke="#9D4EDD" stroke-opacity="0.4"/>
  <text x="45" y="642" fill="#9D4EDD" font-family="monospace" font-size="9">SQUAD MATCHER</text>
  <text x="45" y="668" fill="#FFF3E6" font-family="sans-serif" font-size="15" font-weight="bold">Neural Teammate Matcher</text>
  <text x="45" y="690" fill="#FFF3E6" fill-opacity="0.7" font-family="sans-serif" font-size="11">Match developers, robotics engineers &amp; designers.</text>
  <rect x="45" y="708" width="310" height="32" rx="8" fill="url(#mCyanPurple)"/>
  <text x="135" y="728" fill="#08080C" font-family="monospace" font-size="10" font-weight="bold">FIND TEAMMATES →</text>
</svg>
